<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота №4 — Country Information</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Country Information</h1>

    <select id="countrySelect" aria-label="Оберіть країну" disabled>
      <option value="">Завантаження країн…</option>
    </select>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="info" class="info" hidden>
      <p class="row"><span>Країна:</span> <strong id="cName"></strong></p>
      <p class="row"><span>Столиця:</span> <strong id="cCapital"></strong></p>
      <p class="row"><span>Населення:</span> <strong id="cPopulation"></strong></p>
      <p class="row"><span>Регіон:</span> <strong id="cRegion"></strong></p>
      <p class="row"><span>Площа:</span> <strong id="cArea"></strong></p>
      <p class="row"><span>Валюта:</span> <strong id="cCurrency"></strong></p>
      <img id="cFlag" class="flag" alt="" hidden>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
